name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck install.sh update.sh uninstall.sh lib/*.sh scripts/*.sh
      - name: Verify executable bit on scripts meant to be run directly
        run: |
          # Regression check: these files were once authored on a
          # filesystem with no exec-bit concept and committed as mode 644,
          # which silently broke a real `bash <(curl ...)` / `git clone`
          # install (install.sh itself now invokes the affected ones via
          # an explicit `bash` prefix specifically so that class of bug
          # can't break a live install again -- this check guards the
          # remaining ones meant for direct/manual use, e.g. `ssh-ws`,
          # `./update.sh`, `./uninstall.sh`).
          for f in install.sh update.sh uninstall.sh lib/*.sh scripts/*.sh \
                   scripts/priv_helper.py cli/ssh_ws_cli.py tests/integration/run-matrix.sh; do
            test -x "$f" || { echo "::error file=$f::missing executable bit"; exit 1; }
          done

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r manager/requirements.txt
          pip install ruff pytest pytest-cov
      - name: Ruff
        run: ruff check manager cli scripts tests
      - name: pytest
        run: pytest tests/unit -q --cov=manager/core --cov-report=term-missing

  nginx-config:
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install nginx + deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq nginx
          python -m pip install --upgrade pip
          pip install -r manager/requirements.txt
      - name: Render and validate a sample Nginx config
        run: |
          cd manager
          python - <<'EOF'
          from core import config as config_mod, network
          cfg = config_mod.load()
          cfg["install_mode"] = "domain"
          cfg["domain"] = "vpn.example.com"
          cfg["wss_enabled"] = True
          cfg["ssl_cert_path"] = "/etc/ssl/certs/ssl-cert-snakeoil.pem"
          cfg["ssl_key_path"] = "/etc/ssl/private/ssl-cert-snakeoil.key"
          open("/tmp/sshws-site.conf", "w").write(network.render_nginx_config(cfg))
          EOF
          sudo apt-get install -y -qq ssl-cert
          sudo cp /tmp/sshws-site.conf /etc/nginx/sites-available/sshws-ci-test.conf
          sudo ln -sf /etc/nginx/sites-available/sshws-ci-test.conf /etc/nginx/sites-enabled/
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo nginx -t
